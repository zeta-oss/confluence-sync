[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confluence-sync"
version = "0.1.0"
description = "Sync Markdown documentation to Confluence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "zeta-oss" },
]
dependencies = [
  "requests>=2.31",
  "markdown>=3.4",
  "pyyaml>=6.0",
  "tabulate>=0.9",
  "click>=8.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "responses>=0.25",
  "nox>=2024.3",
  "ruff>=0.4",
]

[project.scripts]
confluence-sync = "confluence_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: hits real Confluence (default: skipped; nox -s live_smoke: required)",
  "slow: mermaid rendering or large fixtures",
]

[tool.coverage.run]
source = ["confluence_sync"]
omit = ["*/commands/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

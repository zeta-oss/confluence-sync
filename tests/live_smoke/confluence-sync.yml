destinations:
  - id: smoke-live
    name: Confluence Sync Smoke Tests
    confluence:
      url: https://zeta-tm.atlassian.net
      space_key: ephemeral
      root_page_title: Confluence Sync Smoke
      root_page_id: null
    source:
      folders:
        - path: docs
          create_root_parent: false
    credentials:
      username: your@email.com
      token_env_var: CONFLUENCE_TOKEN
    options:
      auto_provision_space: true
      add_git_metadata: false
      dry_run: false
      parallel_threads: 1
